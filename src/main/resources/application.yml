spring:
  application:
    name: visionary-ventures-backend
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jobbot}
      database: ${MONGODB_DATABASE:jobbot}

rag:
  groq:
    api-key: ${GROQ_API_KEY:your-groq-key-here}
  voyage:
    api-key: ${VOYAGE_API_KEY:your-voyage-key-here}
      auto-index-creation: true
  
  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# AI Configuration
ai:
  openai:
    api-key: ${OPENAI_API_KEY:your-api-key-here}
    model: ${OPENAI_MODEL:gpt-4}
    temperature: ${OPENAI_TEMPERATURE:0.7}
    max-tokens: ${OPENAI_MAX_TOKENS:2000}
  
  # Local Model Configuration (for alternative AI providers)
  local:
    enabled: ${LOCAL_AI_ENABLED:false}
    endpoint: ${LOCAL_AI_ENDPOINT:http://localhost:11434}
    model: ${LOCAL_AI_MODEL:llama2}

# Application Configuration
app:
  name: AI Job Finder & Auto-Application Assistant
  version: 1.0.0
  description: Backend service for AI-powered job finding and auto-application

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Logging Configuration
logging:
  level:
    root: INFO
    com.jobbot: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
